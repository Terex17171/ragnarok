<!doctype html><html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Ragnarok Monster Rush</title><style> *{box-sizing:border-box}body{background:#101b2c;color:#f5e8ca;font:17px system-ui;margin:0}main{max-width:700px;margin:auto;padding:24px}h1{color:#ffd47e}section{background:#202f43;border:1px solid #40506a;border-radius:18px;padding:22px;margin:16px 0}input,button,select{font:inherit;padding:13px;border-radius:10px;border:1px solid #65748b;margin:5px;color:white;background:#31455f}button{cursor:pointer}button:hover{background:#506884}button:disabled{opacity:.5}#opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}#monster{width:100%;height:220px;object-fit:contain;image-rendering:pixelated}#status{color:#ffd47e}small{color:#aabbd2} .right{background:#26794d!important}</style><main><h1>⚔ Ragnarok Monster Rush</h1><small>Classic + Renewal • First correct answer wins</small><section id=entry><input id=name placeholder="Your name" maxlength=24><input id=code placeholder="Room code (optional)"><button onclick="join(false)">Create room</button><button onclick="join(true)">Join room</button></section><section id=game hidden><div>Room <b id=roomlabel></b> <button onclick="share()">Copy invite</button></div><p id=status></p><div id=hostbox hidden><select id=total><option>10</option><option selected>20</option><option>30</option><option>50</option></select><button onclick="start()">Start game</button></div><div id=quiz hidden><img id=monster alt="Monster sprite" referrerpolicy=no-referrer><div id=opts></div></div></section><section id=board hidden><h2>Leaderboard</h2><ol id=scores></ol></section><p id=error></p></main><script>
const $=id=>document.getElementById(id);let room='',token='',state,lastRound=-1,busy=false; $('code').value=new URLSearchParams(location.search).get('room')||'';
async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,token,...data})});let j=await r.json();if(j.error)throw Error(j.error);return j}
async function join(existing){try{if(existing&&!$('code').value.trim())throw Error('Enter a room code');let j=await post('/join',{room:existing?$('code').value.trim():'',name:$('name').value});room=j.room;token=j.token;$('entry').hidden=true;$('game').hidden=$('board').hidden=false;$('roomlabel').textContent=room;poll()}catch(e){$('error').textContent=e.message}}
function share(){let u=new URL(location.href);u.searchParams.set('room',room);navigator.clipboard?.writeText(u.href).catch(()=>prompt('Invite link',u.href));if(!navigator.clipboard)prompt('Invite link',u.href)}
async function start(){try{await post('/start',{total:+$('total').value});lastRound=-1}catch(e){$('error').textContent=e.message}}
async function answer(choice){if(busy)return;busy=true;try{await post('/answer',{choice,round:state.round})}catch(e){$('error').textContent=e.message}finally{busy=false}}
async function poll(){try{let res=await fetch('/state?'+new URLSearchParams({room,token}));state=await res.json();if(state.error)throw Error(state.error);render();$('error').textContent=''}catch(e){$('error').textContent=e.message}setTimeout(poll,200)}
function render(){let s=state,q=s.phase==='question',re=s.phase==='reveal',end=s.phase==='finished';$('hostbox').hidden=!(s.host&&(s.phase==='lobby'||end));$('quiz').hidden=!(q||re);$('status').textContent=s.phase==='lobby'?`Waiting for players • ${s.count} monster IDs loaded`:end?`Game over! Winner: ${s.players.filter(p=>p.score===s.players[0].score).map(p=>p.name).join(', ')}`:re?`${s.winner?s.winner+' wins this round!':'Time up!'} Answer: ${s.options[s.correct]}`:`Round ${s.round}/${s.total} • ${Math.max(0,Math.ceil(s.until-s.now))}s ${s.locked?'• Wrong answer!':''}`;
if(q||re){if(lastRound!==s.round||$('monster').dataset.mid!=s.mid){lastRound=s.round;$('monster').dataset.mid=s.mid;$('monster').src=`https://www.divine-pride.net/img/monster/original/${s.mid}`;$('monster').onerror=()=>{$('monster').alt='Sprite unavailable';};$('opts').replaceChildren(...s.options.map((o,i)=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(i);return b}))}Array.from($('opts').children).forEach((b,i)=>{b.disabled=!q||s.locked;b.className=re&&i===s.correct?'right':''})}$('scores').replaceChildren(...s.players.map(p=>{let li=document.createElement('li');li.textContent=`${p.name} — ${p.score} pts`;return li}))}
</script></html>
